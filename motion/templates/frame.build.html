/* ============================================================================
   styles.css — 1080 x 1920 (9:16)
   Bright paper, candy palette. The stage carries a real CSS `perspective`, so
   everything inside #world is projected by the browser: distant layers shrink,
   rotated planes foreshorten, and a dolly produces true parallax.
   ========================================================================== */

@font-face{font-family:'Cairo';src:url('../assets/fonts/cairo-400.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Cairo';src:url('../assets/fonts/cairo-700.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Cairo';src:url('../assets/fonts/cairo-900.woff2') format('woff2');font-weight:900;font-display:block}
@font-face{font-family:'Tajawal';src:url('../assets/fonts/tajawal-400.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Tajawal';src:url('../assets/fonts/tajawal-700.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Tajawal';src:url('../assets/fonts/tajawal-900.woff2') format('woff2');font-weight:900;font-display:block}
@font-face{font-family:'Amiri';src:url('../assets/fonts/amiri-700.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'PlexAr';src:url('../assets/fonts/ibm-plex-sans-arabic-700.woff2') format('woff2');font-weight:700;font-display:block}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FFF4E4;overflow:hidden;width:1080px;height:1920px}

#stage{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  perspective:1500px;perspective-origin:50% 46%;
  background:#FFF4E4;font-family:'Cairo',sans-serif;
}
#world{
  position:absolute;inset:0;transform-style:preserve-3d;
  will-change:transform;
}
.plane{
  position:absolute;inset:0;transform-style:preserve-3d;
  pointer-events:none;will-change:transform,filter;
}

/* ------------------------------------------------------- the figure rig */
.girlpart{
  position:absolute;transform-style:preserve-3d;
  background-repeat:no-repeat;background-size:100% 100%;
  will-change:transform,opacity,filter;
}
/* a paper cut-out has thickness: a tight dark contact shadow on one side */
#girlBody,#girlHead{filter:drop-shadow(6px 14px 12px rgba(58,36,80,.30))}
#girlShadow{filter:blur(2px);opacity:.32}

#art{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}

/* ------------------------------------------------------------ typography */
#type{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
#stack{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 70px;text-align:center;white-space:nowrap;
  will-change:transform,opacity;
}
.line{
  font-family:'Cairo',sans-serif;font-weight:900;color:#3A2450;
  line-height:1.34;white-space:nowrap;
}
.line .w{display:inline-block}
/* paper-stack extrusion: the type is built from stacked sheets, so it reads
   as a physical object sitting in the scene rather than flat type on top */
.line .w.kw{
  color:#F0407A;
  text-shadow:
     2px 3px 0 #FF9BB8,  4px 6px 0 #FF6F9C,
     6px 9px 0 #E0326C,  8px 12px 0 #B8235A,
     10px 16px 14px rgba(58,36,80,.28);
}
.line .w.alt{color:#12A09B;
  text-shadow: 2px 3px 0 #37C9C4, 4px 6px 0 #12A09B, 6px 9px 0 #0C807C, 8px 13px 14px rgba(58,36,80,.26);
}
.line .w.sun{color:#FF8F3C;
  text-shadow: 2px 3px 0 #FFC53D, 4px 6px 0 #FF8F3C, 6px 9px 0 #E06A1E, 8px 13px 14px rgba(58,36,80,.26);
}
/* the name gets the loudest treatment in the film */
.line.name{
  font-size:132px;letter-spacing:-.01em;
}
.line.name .w{
  color:#FFF4E4;
  text-shadow:
     0 0 0 #B8235A,
     3px 4px 0 #F0407A, 6px 8px 0 #D62B67,
     9px 12px 0 #A81C50, 12px 17px 0 #7C1138,
     15px 22px 18px rgba(58,36,80,.34);
}
.line.small{font-size:62px}
.line.mid{font-size:86px}
.line.big{font-size:110px}

.sub{
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:38px;
  color:#6B4A85;margin-top:12px;
}

/* ------------------------------------------------------------- overlays */
#papertex,#fibres,#grain,#vignette,#flash{position:absolute;inset:0;pointer-events:none}
#papertex{mix-blend-mode:multiply;opacity:.34;background-size:cover}
#fibres{mix-blend-mode:overlay;opacity:.14;background-size:cover}
#grain{mix-blend-mode:multiply;opacity:.10;background-size:300px}
#vignette{background:radial-gradient(80% 60% at 50% 44%,transparent 46%,rgba(58,36,80,.22) 82%,rgba(58,36,80,.44) 100%)}
#flash{background:#fff;opacity:0;mix-blend-mode:screen}

</style>

<script>/*__CORE__*/
/* ============================================================================
   core.js — the machinery everything else is built on.

   Three things here are what separate this film from flat 2D motion graphics:

   1. A REAL CAMERA. Layers live in 3D space (x, y, z). The stage carries a CSS
      `perspective` and the world carries a real matrix, so Chromium does the
      projection: distant layers shrink, rotated planes foreshorten, and a
      dolly move produces genuine parallax. Nothing is faked with scale().

   2. DEPTH OF FIELD. Blur is computed per layer from its distance to the
      focal plane. Near and far layers go soft; the subject stays crisp. That
      single cue is most of what makes a render read as "shot on a camera"
      rather than "assembled in a browser".

   3. ART-DIRECTED KEYFRAMES. Motion is authored as keyframes with named
      easing curves, then interpolated — the way an animator works in a graph
      editor. Procedural sine waves are used only for idle/breathing motion,
      never for a primary move.
   ========================================================================== */

const W = 1080, H = 1920;
const CX = W / 2, CY = H / 2;
const FPS = 25;
const TAU = Math.PI * 2;

/* ---------------------------------------------------------------- palette */
/* bright paper, candy-coloured — chosen with the client */
const C = {
  paper:   '#FFF4E4',
  cream:   '#FFE3BE',
  blush:   '#FF9BB8',
  pink:    '#FF6F9C',
  pinkHot: '#F0407A',
  turq:    '#37C9C4',
  turqDeep:'#12A09B',
  sun:     '#FFC53D',
  tanger:  '#FF8F3C',
  lilac:   '#B18CFF',
  sky:     '#8FDCFF',
  ink:     '#3A2450',   // deep plum instead of black: softer, still high contrast
  inkSoft: '#6B4A85',

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const mod = (a, n) => ((a % n) + n) % n;

/* Named curves. `io` = ease in and out, `out` = decelerate, `back`/`elastic`

  linear: u => u,
  in:     u => u * u * u,
  out:    u => 1 - Math.pow(1 - u, 3),
  io:     u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}

/* smooth pseudo-noise: deterministic, cheap, good enough for drift */
function noise1(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = hash(String(i + (seed || 0) * 7919));
  const b = hash(String(i + 1 + (seed || 0) * 7919));
  const u = f * f * (3 - 2 * f);
  return lerp(a, b, u) * 2 - 1;
}

</script>
<script>/*__ART__*/
/* ============================================================================
   art.js — the drawn world: every prop is a piece of cut paper.

   Each generator returns an SVG fragment. Nothing is stock art and nothing is
   a flat icon: every shape carries a torn edge, a thickness shadow and a
   paper grain, so the whole frame reads as one physical tabletop theatre.
   ========================================================================== */

/* --------------------------------------------------------------- a star -- */
/* The song is «أحلى نجمة», so the star is the film's signature. It is drawn
   as a slightly irregular five-point shape -- a perfect star looks like clip
   art, a hand-cut one looks like paper. */
function star(cx, cy, r, fill, rot, seed, stroke) {
  const rnd = rng(Math.floor(seed * 1000) + 7);
  let d = '';
  const N = 10;
  for (let i = 0; i < N; i++) {
    const a = rot + (i / N) * TAU - Math.PI / 2;
    const rr = (i % 2 === 0 ? r : r * 0.44) * (1 + (rnd() - .5) * .12);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    d += (i === 0 ? 'M' : 'L') + n2(x) + ' ' + n2(y) + ' ';
  }
  return `<path d="${d}Z" fill="${fill}" ${stroke ? `stroke="${stroke}" stroke-width="2.5"` : ''}/>`;
}

/* ------------------------------------------------------------ a cloud ---- */
function cloud(cx, cy, w, fill, seed) {
  const rnd = rng(Math.floor(seed * 1000) + 31);
  let d = `M${n2(cx - w / 2)} ${n2(cy)}`;
  const lobes = 5;
  for (let i = 0; i < lobes; i++) {
    const u = i / (lobes - 1);
    const x = lerp(cx - w / 2, cx + w / 2, u);
    const rr = w * (0.16 + 0.13 * Math.sin(u * Math.PI)) * (1 + (rnd() - .5) * .2);
    d += ` Q${n2(x)} ${n2(cy - rr * 1.5)} ${n2(x + w / (lobes - 1))} ${n2(cy)} `;
  }
  d += ` L${n2(cx + w / 2)} ${n2(cy + w * .12)} L${n2(cx - w / 2)} ${n2(cy + w * .12)} Z`;
  return `<path d="${d}" fill="${fill}"/>`;
}

/* ------------------------------------------------------------ confetti --- */
/* small torn paper squares, each tumbling on its own axis */
function confetti(t, n, seed, box, pal) {
  const rnd = rng(seed);
  let o = '';
  for (let i = 0; i < n; i++) {
    const sx = rnd(), sy = rnd(), sp = .35 + rnd() * .9, phase = rnd() * TAU;
    const x = box[0] + sx * box[2];
    const fall = mod(sy + t * sp * .22, 1);
    const y = box[1] + fall * box[3];
    const rot = (t * (40 + rnd() * 160) + phase * 57) % 360;
    const w = 9 + rnd() * 16, h = 5 + rnd() * 9;
    const col = pal[Math.floor(rnd() * pal.length)];
    // tumble: squash the width as it spins, so it reads as rotation, not slide
    const sq = Math.abs(Math.cos((rot + phase) * Math.PI / 180));
    o += `<rect x="${n2(x - w / 2)}" y="${n2(y)}" width="${n2(w * (0.25 + .75 * sq))}" height="${n2(h)}" `
      + `rx="1.5" fill="${col}" transform="rotate(${n2(rot)} ${n2(x)} ${n2(y)})" opacity="${n2(.55 + rnd() * .45)}"/>`;
  }
  return o;
}

/* -------------------------------------------------------------- sparkle -- */
function sparkle(cx, cy, r, fill, op) {
  return `<path d="M${n2(cx)} ${n2(cy - r)} Q${n2(cx + r * .16)} ${n2(cy - r * .16)} ${n2(cx + r)} ${n2(cy)} `
    + `Q${n2(cx + r * .16)} ${n2(cy + r * .16)} ${n2(cx)} ${n2(cy + r)} `
    + `Q${n2(cx - r * .16)} ${n2(cy + r * .16)} ${n2(cx - r)} ${n2(cy)} `
    + `Q${n2(cx - r * .16)} ${n2(cy - r * .16)} ${n2(cx)} ${n2(cy - r)} Z" fill="${fill}" opacity="${op}"/>`;
}

/* --------------------------------------------------------------- crayon --- */
function crayon(x, y, len, col, rot) {
  const w = len * .17;
  return `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(rot)})">`
    + `<rect x="0" y="${n2(-w / 2)}" width="${n2(len * .74)}" height="${n2(w)}" rx="${n2(w * .18)}" fill="${col}"/>`
    + `<rect x="${n2(len * .70)}" y="${n2(-w / 2)}" width="${n2(len * .10)}" height="${n2(w)}" fill="${rgba(C.ink, .16)}"/>`
    + `<path d="M${n2(len * .80)} ${n2(-w / 2)} L${n2(len)} 0 L${n2(len * .80)} ${n2(w / 2)} Z" fill="${mixHex(col, C.ink, .34)}"/>`
    + `</g>`;
}

/* ----------------------------------------------------------------- book --- */
function openBook(cx, cy, w, colPage, colCover) {
  const h = w * .62;
  return `<g>`
    + `<path d="M${n2(cx - w / 2)} ${n2(cy - h * .34)} Q${n2(cx)} ${n2(cy - h * .52)} ${n2(cx + w / 2)} ${n2(cy - h * .34)} `
    + `L${n2(cx + w / 2)} ${n2(cy + h * .30)} Q${n2(cx)} ${n2(cy + h * .48)} ${n2(cx - w / 2)} ${n2(cy + h * .30)} Z" fill="${colCover}"/>`
    + `<path d="M${n2(cx - w / 2 + 10)} ${n2(cy - h * .28)} Q${n2(cx)} ${n2(cy - h * .44)} ${n2(cx + w / 2 - 10)} ${n2(cy - h * .28)} `
    + `L${n2(cx + w / 2 - 10)} ${n2(cy + h * .24)} Q${n2(cx)} ${n2(cy + h * .40)} ${n2(cx - w / 2 + 10)} ${n2(cy + h * .24)} Z" fill="${colPage}"/>`
    + `<line x1="${n2(cx)}" y1="${n2(cy - h * .42)}" x2="${n2(cx)}" y2="${n2(cy + h * .38)}" stroke="${rgba(C.ink, .30)}" stroke-width="3"/>`
    + `</g>`;
}

/* --------------------------------------------------------------- balloon -- */
function balloon(x, y, r, col, sway) {
  return `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(sway)})">`
    + `<ellipse cx="0" cy="0" rx="${n2(r)}" ry="${n2(r * 1.18)}" fill="${col}"/>`
    + `<path d="M0 ${n2(r * 1.18)} l-7 14 l14 0 Z" fill="${mixHex(col, C.ink, .35)}"/>`
    + `<path d="M0 ${n2(r * 1.30)} q22 34 4 74 q-14 22 -20 4" fill="none" stroke="${rgba(C.ink, .45)}" stroke-width="2"/>`
    + `<ellipse cx="${n2(-r * .34)}" cy="${n2(-r * .42)}" rx="${n2(r * .22)}" ry="${n2(r * .30)}" fill="#FFF" opacity=".42" transform="rotate(-22)"/>`
    + `</g>`;
}

/* ---------------------------------------------------------------- medal -- */
function medal(cx, cy, r) {
  return `<g transform="translate(${n2(cx)} ${n2(cy)})">`
    + `<path d="M${n2(-r * .9)} ${n2(-r * .6)} L${n2(-r * .2)} ${n2(-r * 2.3)} L${n2(r * .1)} ${n2(-r * .7)} Z" fill="${C.turq}"/>`
    + `<path d="M${n2(r * .9)} ${n2(-r * .6)} L${n2(r * .2)} ${n2(-r * 2.3)} L${n2(-r * .1)} ${n2(-r * .7)} Z" fill="${C.turqDeep}"/>`
    + `<circle r="${n2(r)}" fill="${C.sun}" stroke="${C.tanger}" stroke-width="${n2(r * .13)}"/>`
    + star(0, 0, r * .62, C.tanger, 0, 4.2) +
    `</g>`;
}

/* ==========================================================================
   SCENES
   Each returns {svg, planes} — planes carry the 3D placement of the figure
   and of any depth props, so the camera move affects them for real.
   ========================================================================== */

/* ------------------------------------------------------- 1. title / open */
function artOpen(S) {
  const { t, p, energy } = S;
  let o = '<defs>' + rgDef('rayY', [[0, C.sun, .55], [1, C.sun, 0]], 0, 0, 0, 1) + '</defs>';

  /* rays behind the title */
  const spin = t * 5;
  o += `<g transform="translate(${CX} ${780}) rotate(${n2(spin)})" opacity=".30">`;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    o += `<path d="M0 0 L${n2(Math.cos(a - .06) * 900)} ${n2(Math.sin(a - .06) * 900)} `
      + `L${n2(Math.cos(a + .06) * 900)} ${n2(Math.sin(a + .06) * 900)} Z" `
      + `fill="${i % 2 ? C.sun : C.blush}" opacity="${i % 2 ? .5 : .35}"/>`;
  }
  o += '</g>';

  /* a constellation of stars arranging itself into one big star */
  const N = 26;
  const rnd = rng(909);
  const form = ease(clamp(seg(p, .10, .72), 0, 1));
  for (let i = 0; i < N; i++) {
    const r0 = 620 + rnd() * 260, a0 = rnd() * TAU;
    const tx = CX + Math.cos(a0) * r0, ty = 780 + Math.sin(a0) * r0;
    // target: points on a star outline
    const ai = (i / N) * TAU - Math.PI / 2;
    const rr = (i % 2 === 0 ? 300 : 132);
    const gx = CX + Math.cos(ai) * rr, gy = 780 + Math.sin(ai) * rr;
    const x = lerp(tx, gx, form), y = lerp(ty, gy, form);
    const sz = lerp(10, 26, form) * (.7 + (.3 + .7 * rnd()));
    o += star(x, y, sz, i % 3 === 0 ? C.sun : (i % 3 === 1 ? C.turq : C.blush),
      t * 30 + i, i * 1.7);
  }
  /* the hero star, once formed */
  if (form > .82) {
    const k = seg(form, .82, 1);
    const pop = ease(clamp(seg(p, .68, .86), 0, 1));
    o += `<g transform="translate(${CX} 780) scale(${n2(.6 + .4 * E.back(pop))})">`
      + star(0, 0, 210 * k, C.sun, t * 12, 3.3, C.tanger) + '</g>';
  }
  o += confetti(t, 34, 44, [0, 0, W, H], [C.pink, C.turq, C.sun, C.lilac, C.tanger]);
  o += sparkle(CX + 190, 560, 34 + 12 * Math.sin(t * 4), C.paper, .9);
  o += sparkle(CX - 240, 980, 22 + 10 * Math.sin(t * 5 + 2), C.paper, .8);
  return o;
}

/* ------------------------------------------- 1b. bloom (the title card) -- */
/* Paper flowers opening behind the title. Each petal is a separate lobe that
   unfolds from the centre, so the frame blossoms rather than fading up. */
function artBloom(S) {
  const { t, p } = S;
  let o = '';
  const rnd = rng(1717);
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * TAU + t * .12;
    const rr = 300 + rnd() * 320;
    const x = CX + Math.cos(a) * rr;
    const y = 820 + Math.sin(a) * rr * .82;
    const open = ease(clamp(seg(p, .04 + (i % 5) * .045, .40 + (i % 5) * .045), 0, 1));
    const R = (34 + rnd() * 40) * (.35 + .65 * open);
    const col = [C.pink, C.blush, C.sun, C.lilac, C.tanger][i % 5];
    o += `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(t * 18 + i * 33)})">`;
    for (let k = 0; k < 6; k++) {
      const pa = (k / 6) * TAU;
      o += `<ellipse cx="${n2(Math.cos(pa) * R * .62)}" cy="${n2(Math.sin(pa) * R * .62)}" `
        + `rx="${n2(R * .52)}" ry="${n2(R * .34)}" fill="${col}" `
        + `transform="rotate(${n2(pa * 57.3)})" opacity="${n2(.55 + .45 * open)}"/>`;
    }
    o += `<circle r="${n2(R * .30)}" fill="${C.sun}"/>`
      + `<circle r="${n2(R * .16)}" fill="${C.tanger}"/></g>`;
  }
  o += confetti(t, 18, 202, [0, 0, W, H], [C.blush, C.sun, C.turq]);
  return o;
}

/* ------------------------------------ 2b. medal — «المركز الأول» -------- */
/* The song literally says «first place», so the scene is built around the
   medal: it swings in on a ribbon, then the frame behind it erupts in rays. */
function artMedal(S) {
  const { t, p, beat } = S;
  let o = '';
  const near = 1 - Math.min(1, Math.abs(beat - 0));
  /* The medal is drawn on the MID plane, which sits BEHIND the figure. Placed
     centrally it vanished entirely behind her head (her head is 352px wide,
     the medal only 264). It is therefore put in the clear side channels —
     the figure occupies x 288..792 — as a pair of medallions flanking her,
     with the sunburst centred behind her where it cannot hide. */
  const MX = CX, MY = 980;
  /* rays behind */
  o += `<g transform="translate(${MX} ${MY})" opacity="${n2(.24 + .34 * near)}">`;
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * TAU + t * .22;
    const L = 380 + 90 * near;
    o += `<path d="M0 0 L${n2(Math.cos(a - .045) * L)} ${n2(Math.sin(a - .045) * L)} `
      + `L${n2(Math.cos(a + .045) * L)} ${n2(Math.sin(a + .045) * L)} Z" `
      + `fill="${i % 2 ? C.sun : C.blush}" opacity="${i % 2 ? .5 : .34}"/>`;
  }
  o += '</g>';
  /* the medal swings in and settles */
  const sw = E.out(clamp(seg(p, .05, .42), 0, 1));
  /* two medallions, swinging in from the outside on their ribbons */
  [[168, 900, -1], [912, 900, 1]].forEach(([px, py, dir], k) => {
    const d = E.out(clamp(seg(p, .06 + k * .07, .46 + k * .07), 0, 1));
    const ang = dir * (1 - d) * 46 + Math.sin(t * 1.8 + k * 2) * 5 * d;
    const x = px + dir * (1 - d) * 210;
    o += `<g transform="translate(${n2(x)} ${n2(py)}) rotate(${n2(ang)}) `
      + `scale(${n2(.55 + .45 * d)})">` + medal(0, 0, 104) + '</g>';
  });
  o += confetti(t, 24, 404, [0, 0, W, H], [C.sun, C.pink, C.turq]);
  return o;
}

/* ------------------------------------------- 4b. rainbow (second chorus) - */
/* «أَحْلَى نَجْمَة» returns, so the signature gets its own signature image:
   an arc of paper bands that sweeps across the frame behind her. */
function artRainbow(S) {
  const { t, p } = S;
  let o = '';
  const bands = [C.pink, C.tanger, C.sun, C.turq, C.lilac];
  const sweep = E.out(clamp(seg(p, .04, .62), 0, 1));
  const cx0 = CX, cy0 = 1180;
  for (let i = 0; i < bands.length; i++) {
    const R = (300 + i * 54) * (.55 + .45 * sweep);
    const a0 = Math.PI * (1.06 + .02 * i) - .5 * sweep;
    const a1 = Math.PI * (1.94 - .02 * i) + .3 * sweep;
    o += `<path d="M${n2(cx0 + Math.cos(a0) * R)} ${n2(cy0 + Math.sin(a0) * R * .82)} `
      + `A${n2(R)} ${n2(R * .82)} 0 0 1 ${n2(cx0 + Math.cos(a1) * R)} ${n2(cy0 + Math.sin(a1) * R * .82)}" `
      + `fill="none" stroke="${bands[i]}" stroke-width="46" stroke-linecap="round" `
      + `opacity="${n2(.42 + .38 * sweep)}"/>`;
  }
  /* a star riding the top of the arc */
  const ay = cy0 - (300 + 4 * 54) * (.55 + .45 * sweep) * .82;
  o += star(CX, ay, 62, C.sun, t * 16, 5.5, C.tanger);
  o += confetti(t, 26, 505, [0, 0, W, H], [C.pink, C.sun, C.turq, C.lilac]);
  return o;
}

/* ------------------------------------------------------- 2. clap / chorus */
function artClap(S) {
  const { t, p, energy, beat } = S;
  let o = '';
  /* a burst on every detected beat — driven by the measured grid, not a timer */
  const near = 1 - Math.min(1, Math.abs(beat - 0));
  o += `<g transform="translate(${CX} ${620})" opacity="${n2(.30 + .5 * near)}">`;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    const rr = 250 + 90 * near + Math.sin(t * 3 + i) * 20;
    o += star(Math.cos(a) * rr, Math.sin(a) * rr, 26 + 12 * near,
      i % 2 ? C.pink : C.sun, t * 40 + i, i * 2.1);
  }
  o += '</g>';
  /* clapping hands as two paper mittens meeting */
  const cl = Math.abs(Math.sin(beat * Math.PI));
  const gap = 30 + 130 * cl;
  o += `<g opacity=".9">`
    + mitten(CX - gap - 60, 1180, -18 - 14 * cl, C.blush)
    + mitten(CX + gap + 60, 1180, 18 + 14 * cl, C.blush)
    + '</g>';
  o += confetti(t, 30, 77, [0, 0, W, H], [C.pink, C.turq, C.sun, C.lilac]);
  return o;
}
function mitten(x, y, rot, col) {
  return `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(rot)})">`
    + `<ellipse cx="0" cy="0" rx="62" ry="74" fill="${col}"/>`
    + `<ellipse cx="${-34}" cy="${-58}" rx="26" ry="30" fill="${col}"/>`
    + `<path d="M-52 30 q52 26 104 0" stroke="${rgba(C.ink, .18)}" stroke-width="5" fill="none"/>`
    + `</g>`;
}

/* ---------------------------------------------------- 3. candy / verse 1 */
function artCandy(S) {
  const { t, p } = S;
  let o = '';
  const rnd = rng(313);
  /* sweets and gems orbiting — «يا سكر يا حتة ماس» */
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * TAU + t * .34;
    const rr = 330 + Math.sin(t * 1.1 + i) * 46;
    const x = CX + Math.cos(a) * rr, y = 700 + Math.sin(a) * rr * .78;
    const s = 26 + rnd() * 22;
    const col = [C.pink, C.turq, C.sun, C.lilac, C.tanger][i % 5];
    if (i % 3 === 0) {
      o += `<g transform="translate(${n2(x)} ${n2(y)}) rotate(${n2(t * 40 + i)})">`
        + `<path d="M0 ${n2(-s)} L${n2(s * .74)} 0 L0 ${n2(s)} L${n2(-s * .74)} 0 Z" fill="${col}" stroke="${mixHex(col, C.ink, .3)}" stroke-width="3"/>`
        + `<path d="M0 ${n2(-s)} L0 ${n2(s)} M${n2(-s * .74)} 0 L${n2(s * .74)} 0" stroke="${rgba(C.paper, .6)}" stroke-width="2"/></g>`;
    } else {
      o += `<circle cx="${n2(x)}" cy="${n2(y)}" r="${n2(s * .78)}" fill="${col}" opacity=".92"/>`
        + `<circle cx="${n2(x - s * .26)}" cy="${n2(y - s * .30)}" r="${n2(s * .22)}" fill="#FFF" opacity=".5"/>`;
    }
  }
  o += confetti(t, 22, 12, [0, 0, W, H], [C.blush, C.sun, C.turq]);
  return o;
}

/* --------------------------------------------------- 4. school / verse 2 */
function artSchool(S) {
  const { t, p } = S;
  let o = '';
  /* «ألوان وكتاب وحروف» */
  o += openBook(CX, 1180, 520, C.paper, C.turq);
  const letters = ['ا', 'ل', 'و', 'ا', 'ن'];
  for (let i = 0; i < 5; i++) {
    const u = i / 5;
    const fly = clamp(seg(p, .10 + u * .07, .42 + u * .07), 0, 1);
    const x = lerp(CX - 460, CX - 200 + i * 100, E.out(fly));
    const y = lerp(1500, 1080, E.out(fly)) + Math.sin(t * 2 + i) * 8;
    o += `<text x="${n2(x)}" y="${n2(y)}" font-family="Cairo" font-weight="900" font-size="76" `
      + `fill="${[C.pink, C.sun, C.turq, C.lilac, C.tanger][i]}" text-anchor="middle" `
      + `opacity="${n2(fly)}">${letters[i]}</text>`;
  }
  /* crayons standing in a row */
  for (let i = 0; i < 5; i++) {
    const x = CX - 240 + i * 120;
    const wob = Math.sin(t * 2.4 + i * .8) * 6;
    o += crayon(x, 1560 + wob, 190, [C.pink, C.sun, C.turq, C.lilac, C.tanger][i], -78 + wob);
  }
  o += confetti(t, 20, 55, [0, 0, W, H], [C.sun, C.turq, C.blush]);
  return o;
}

/* --------------------------------------------------- 5. growing / bridge */
function artGrow(S) {
  const { t, p } = S;
  let o = '';
  /* «بكرا تكبر هالأميرة» — a ladder of stars she climbs, receding in depth */
  for (let i = 0; i < 7; i++) {
    const u = i / 6;
    const rise = clamp(seg(p, .06 + u * .05, .48 + u * .06), 0, 1);
    const y = lerp(1620, 380, E.out(rise)) + Math.sin(t * 1.6 + i) * 10;
    const x = CX - 330 + u * 660;
    const s = lerp(20, 54, u);
    o += star(x, y, s, i % 2 ? C.sun : C.lilac, t * 20 + i, i * 3.1);
    if (i > 0) {
      const x0 = CX - 330 + ((i - 1) / 6) * 660;
      const u0 = (i - 1) / 6;
      const y0 = lerp(1620, 380, E.out(clamp(seg(p, .06 + u0 * .05, .48 + u0 * .06), 0, 1)));
      o += `<line x1="${n2(x0)}" y1="${n2(y0)}" x2="${n2(x)}" y2="${n2(y)}" `
        + `stroke="${C.blush}" stroke-width="4" stroke-dasharray="2 14" opacity="${n2(.5 * rise)}" stroke-linecap="round"/>`;
    }
  }
  /* a crown for the princess, descending */
  const cr = E.out(clamp(seg(p, .58, .88), 0, 1));
  if (cr > .01) {
    const cy = lerp(-200, 300, cr);
    o += `<g transform="translate(${CX} ${n2(cy)}) rotate(${n2(Math.sin(t * 1.4) * 5)})">`
      + `<path d="M${-110} 60 L${-110} ${-40} L${-56} 6 L0 ${-72} L${56} 6 L${110} ${-40} L${110} 60 Z" `
      + `fill="${C.sun}" stroke="${C.tanger}" stroke-width="6" stroke-linejoin="round"/>`
      + `<circle cx="0" cy="${-92}" r="16" fill="${C.pinkHot}"/>`
      + `<circle cx="${-110}" cy="${-58}" r="13" fill="${C.turq}"/>`
      + `<circle cx="${110}" cy="${-58}" r="13" fill="${C.turq}"/>`
      + `</g>`;
  }
  o += confetti(t, 26, 88, [0, 0, W, H], [C.lilac, C.sun, C.blush, C.turq]);
  return o;
}

/* -------------------------------------------------- 6. celebrate / outro */
function artParty(S) {
  const { t, p } = S;
  let o = '';
  o += `<g transform="translate(${CX} 700)">`;
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * TAU + t * .5;
    const rr = 380 + Math.sin(t * 2 + i) * 60;
    o += star(Math.cos(a) * rr, Math.sin(a) * rr, 30 + (i % 4) * 9,
      [C.pink, C.sun, C.turq, C.lilac][i % 4], t * 30 + i, i * 1.3);
  }
  o += '</g>';
  for (let i = 0; i < 9; i++) {
    const x = 110 + (i % 5) * 215 + Math.sin(t * 1.3 + i) * 22;
    const y = 1420 + Math.sin(t * 1.7 + i * 1.4) * 30 - (i > 4 ? 90 : 0);
    o += balloon(x, y, 46, [C.pink, C.sun, C.turq, C.lilac, C.tanger][i % 5],
      Math.sin(t * 1.5 + i) * 8);
  }
  o += confetti(t, 60, 101, [0, 0, W, H], [C.pink, C.sun, C.turq, C.lilac, C.tanger, C.blush]);
  for (let i = 0; i < 8; i++) {
    o += sparkle(120 + (i * 137) % 840, 260 + (i * 211) % 1200,
      14 + 10 * Math.abs(Math.sin(t * 3 + i)), C.paper, .85);
  }
  return o;
}

/* ------------------------------------------------------------- 7. logo -- */
/* The mark is NOT moved as one picture. It is diced into tiles; every tile is
   a separate sheet that flies in along its own 3D arc and lands at a slightly
   different moment. Only when the last one seats does the light sweep cross.
   That is the difference between "a logo animating" and "a logo animating in
   layers", which is what was asked for. */
function artLogo(S) {
  const { t, p, logoTiles, logoBox } = S;
  let o = '<defs>' +
    `<linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">` +
    `<stop offset="0" stop-color="#fff" stop-opacity="0"/>` +
    `<stop offset=".44" stop-color="#fff" stop-opacity=".95"/>` +
    `<stop offset=".54" stop-color="#fff" stop-opacity="1"/>` +
    `<stop offset=".64" stop-color="#fff" stop-opacity=".95"/>` +
    `<stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>` +
    `<mask id="logomask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">` +
    `<image href="../assets/brand/wamd_logo.png" x="${logoBox.x}" y="${logoBox.y}" ` +
    `width="${logoBox.w}" height="${logoBox.h}" preserveAspectRatio="none"/></mask>` +
    /* floods the mark to a flat colour so it can serve as the stacked sheet
       behind the real one — a second sheet of paper, not a broken piece */
    `<filter id="dyeTurq" x="-20%" y="-20%" width="140%" height="140%">` +
    `<feFlood flood-color="${C.turq}" result="f"/>` +
    `<feComposite in="f" in2="SourceGraphic" operator="in"/></filter>` +
    glowDef('gLogoT', C.sun, 10) + '</defs>';

  const halo = seg(p, .06, .30) * (1 - seg(p, .90, 1) * .5);
  o += `<ellipse cx="${CX}" cy="${n2(logoBox.y + logoBox.h / 2)}" `
    + `rx="${n2(logoBox.w * 1.30)}" ry="${n2(logoBox.h * .78)}" fill="${C.sun}" opacity="${n2(.16 * halo)}"/>`;

  /* The mark is NEVER diced.
     It was previously cut into a 7x7 grid of 45 tiles so each could fly in on
     its own arc. That read as the logo being SHATTERED, which was not what was
     wanted: «طبقات» means the mark should move as stacked sheets, not come
     apart. So the mark now stays whole and the LAYERS around it do the work:

       1. a coloured paper shadow, offset behind, arriving a beat later
       2. the mark itself, turning in 3D as one sheet
       3. a band that wipes across and reveals it
       4. a warm bloom, masked to the mark's own shape
       5. stars and confetti assembling around it                              */

  const inU = E.out(clamp(seg(p, .02, .30), 0, 1));
  const shU = E.out(clamp(seg(p, .10, .38), 0, 1));        // the colour sheet lags

  /* 1 — a coloured sheet of paper sitting behind the mark */
  if (shU > .001) {
    const dx = lerp(-46, -13, shU), dy = lerp(-40, -11, shU);
    o += `<g transform="translate(${n2(logoBox.x + dx)} ${n2(logoBox.y + dy)}) `
      + `scale(${n2(.92 + .08 * shU)})" opacity="${n2(shU * .85)}">`
      + `<image href="../assets/brand/wamd_logo.png" width="${n2(logoBox.w)}" `
      + `height="${n2(logoBox.h)}" preserveAspectRatio="none" `
      + `filter="url(#dyeTurq)"/></g>`;
  }

  /* 2 — the mark, turning in 3D as one sheet of paper */
  if (inU > .001) {
    const ry = lerp(-58, 0, E.out(inU));
    const sc = lerp(.62, 1, E.back(inU));
    const rz = lerp(7, 0, inU);
    const ty = lerp(-90, 0, E.out(inU));
    /* SVG transforms are 2D — rotateY/rotateX/rotateZ are CSS only and
       Chromium rejects them outright (which killed this group silently).
       A Y-axis turn is faked the standard way: squash horizontally by
       cos(angle), which is exactly what a perspective-free turn looks like. */
    const sx = Math.cos(ry * Math.PI / 180);
    o += `<g transform="translate(${CX} ${n2(logoBox.y + logoBox.h / 2)}) `
      + `scale(${n2(sx * sc)} ${n2(sc)}) rotate(${n2(rz)}) translate(0 ${n2(ty)})" `
      + `opacity="${n2(clamp(inU * 2, 0, 1))}">`
      + `<image href="../assets/brand/wamd_logo.png" `
      + `x="${n2(-logoBox.w / 2)}" y="${n2(-logoBox.h / 2)}" `
      + `width="${n2(logoBox.w)}" height="${n2(logoBox.h)}" `
      + `preserveAspectRatio="none"/></g>`;
  }

  /* --- 3. a band wipes across and polishes the mark --- */
  const sw = seg(p, .46, .74);
  if (sw > 0 && sw < 1) {
    const cym = logoBox.y + logoBox.h / 2;
    const span = logoBox.w * 2.6;
    const x0 = CX - span / 2 + sw * span * 1.25 - span * .14;
    o += `<g mask="url(#logomask)"><rect x="${n2(x0)}" y="${n2(cym - logoBox.h * .8)}" `
      + `width="${n2(span * .20)}" height="${n2(logoBox.h * 1.6)}" fill="url(#sweepg)" `
      + `transform="rotate(-8 ${CX} ${n2(cym)})"/></g>`;
  }
  /* --- 4. a warm bloom, masked so it can only light the mark itself --- */
  if (sw > .5) {
    const b = bump(p, .66, .10);
    o += `<g mask="url(#logomask)" filter="url(#gLogoT)">`
      + `<rect x="${logoBox.x}" y="${logoBox.y}" width="${logoBox.w}" height="${logoBox.h}" `
      + `fill="${C.sun}" fill-opacity="${n2(b * .70)}"/></g>`;
  }
  /* --- 5. stars settling into a ring around the mark --- */
  const ring = E.out(clamp(seg(p, .30, .70), 0, 1));
  if (ring > .001) {
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU - Math.PI / 2 + t * .18;
      const rr = lerp(logoBox.w * 1.30, logoBox.w * .86, ring);
      const x = CX + Math.cos(a) * rr;
      const y = logoBox.y + logoBox.h / 2 + Math.sin(a) * rr;
      o += star(x, y, 15 + (i % 3) * 6,
        [C.sun, C.pink, C.turq, C.lilac][i % 4], t * 26 + i, i * 2.7);
    }
  }
  /* confetti, because this is a children's film and the mark should land happy */
  o += confetti(t, 26, 303, [0, 0, W, H], [C.pink, C.sun, C.turq, C.lilac, C.tanger]);
  return o;
}

function rgDef(id, stops, x1, y1, x2, y2) {
  const s = stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('');
  return `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${s}</linearGradient>`;
}
function glowDef(id, col, dev) {
  return `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="${dev}" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
}

const ART = {
  open: artOpen, bloom: artBloom, clap: artClap, candy: artCandy,
  medal: artMedal, rainbow: artRainbow,
  school: artSchool, grow: artGrow, party: artParty, logo: artLogo,
};

</script>
<script>/*__ENGINE__*/
/* ============================================================================
   engine.js — camera, rig and type.

   window.__boot() once, then window.__render(t) for any absolute time.
   Pure function of t: frame 1 and frame 1500 can be rendered in separate
   processes and will still cut together.
   ========================================================================== */

const EL = {};
let MAP = {};
let sceneIdx = -1;
let wordEls = [], wordData = [];

/* ------------------------------------------------------------------ boot */
function boot() {
  EL.world = document.getElementById('world');
  EL.art = document.getElementById('art');
  EL.stack = document.getElementById('stack');
  EL.type = document.getElementById('type');
  EL.flash = document.getElementById('flash');
  EL.vig = document.getElementById('vignette');
  EL.grain = document.getElementById('grain');
  EL.planes = {
    sky: document.getElementById('p_sky'), far: document.getElementById('p_far'),
    mid: document.getElementById('p_mid'), girl: document.getElementById('p_girl'),
    near: document.getElementById('p_near'), fore: document.getElementById('p_fore'),
  };
  EL.head = document.getElementById('girlHead');
  EL.body = document.getElementById('girlBody');
  EL.shadow = document.getElementById('girlShadow');

  const FONTS = ['900 132px Cairo', '900 110px Cairo', '700 86px Cairo',
                 '400 62px Cairo', '700 38px Tajawal', '700 76px Amiri'];
  for (const f of FONTS) { try { document.fonts.load(f); } catch (e) { } }

  EL.grain.style.backgroundImage = `url('../assets/tex/grain.png')`;
  document.getElementById('papertex').style.backgroundImage = `url('../assets/tex/paper.png')`;
  document.getElementById('fibres').style.backgroundImage = `url('../assets/tex/fibres.png')`;

  MAP.girls = DATA.girls;
  /* the end-card mark: 560 wide, centred at y=760 — 52% of frame width,
     which is a real logo size for a vertical end card */
  const LW = 560, LH = LW / DATA.logo.aspect;
  MAP.logoBox = { x: CX - LW / 2, y: 690 - LH / 2, w: LW, h: LH };
  MAP.logoTiles = DATA.logoTiles;

  const env = DATA.env;
  MAP.step = env.hopSec; MAP.rms = env.rms; MAP.vocal = env.vocal;
  MAP.beats = DATA.beats;
}

function envAt(t, arr, step, win) {
  const i0 = Math.max(0, Math.floor((t - win / 2) / step));
  const i1 = Math.min(arr.length, Math.ceil((t + win / 2) / step));
  let s = 0, n = 0;
  for (let i = i0; i < i1; i++) { s += arr[i]; n++; }
  return n ? s / n : 0;
}

function findScene(t) {
  const S = DATA.timeline.scenes;
  for (let i = 0; i < S.length; i++) if (t < S[i].end) return S[i];
  return S[S.length - 1];
}

/* ------------------------------------------------------------ buildScene */
function buildScene(scene) {
  sceneIdx = scene.__i;
  wordEls = []; wordData = [];
  let html = '';
  (scene.lines || []).forEach((ln, li) => {
    const cls = ['line', ln.cls || ''].join(' ');
    html += `<div class="${cls}" data-li="${li}">`;
    (ln.words || []).forEach((w, wi) => {
      const k = w.k ? ' ' + (ln.kwStyle || 'kw') : '';
      html += `<span class="w${k}" data-w="${wordData.length}">${w.t}</span>`;
      if (wi < ln.words.length - 1) html += `<span class="w"> </span>`;
      wordData.push(Object.assign({}, w, { li }));
    });
    html += `</div>`;
  });
  if (scene.sub) html += `<div class="sub" id="sub">${scene.sub}</div>`;
  EL.stack.innerHTML = html;
  wordEls = Array.prototype.slice.call(EL.stack.querySelectorAll('.w[data-w]'));

  const L = EL.stack.querySelectorAll('.line');
  for (let i = 0; i < L.length; i++) {
    const ln = scene.lines[i];
    L[i].style.fontSize = (ln.size || scene.size || 96) + 'px';
  }
  const sub = document.getElementById('sub');
  if (sub) sub.style.fontSize = (scene.subSize || 38) + 'px';

  autofit(scene);
}

/* 1080px is narrow for display Arabic; every line is measured and shrunk to
   fit rather than allowed to overflow or wrap mid-phrase. */
const SAFE_W = 1080 - 2 * 70;
function autofit(scene) {
  const L = EL.stack.querySelectorAll('.line');
  for (let i = 0; i < L.length; i++) {
    const el = L[i];
    let fs = parseFloat(el.style.fontSize) || 96;
    for (let k = 0; k < 4; k++) {
      const r = document.createRange();
      r.selectNodeContents(el);
      const w = r.getBoundingClientRect().width;
      if (!(w > SAFE_W)) break;
      fs = Math.floor(fs * (SAFE_W / w) * .985);
      el.style.fontSize = fs + 'px';
    }
  }
}

/* ==========================================================================
   THE CAMERA
   A real 3D transform on #world. `perspective` lives on #stage, so Chromium
   projects the planes: depth genuinely shrinks and rotates foreshorten.
   ========================================================================== */
function applyCamera(cam) {
  const z = cam.z || 0, rx = cam.rx || 0, ry = cam.ry || 0, rz = cam.rz || 0;
  EL.world.style.transform =
    `translate3d(0,0,${n2(z)}px) rotateX(${n2(rx)}deg) rotateY(${n2(ry)}deg) ` +
    `rotateZ(${n2(rz)}deg) translate3d(${n2(-(cam.x || 0))}px,${n2(-(cam.y || 0))}px,0)`;
}

/* Depth of field: blur each plane by how far it sits from the focal plane.
   This one cue is most of what separates "shot on a camera" from "assembled". */
function applyDof(planes, focusZ, strength) {
  for (const k in planes) {
    const d = Math.abs((planes[k] || 0) - focusZ);
    const b = clamp(d / 900, 0, 1) * strength;
    EL.planes[k].style.filter = b > .25 ? `blur(${n2(b)}px)` : 'none';
  }
}

/* ==========================================================================
   THE RIG
   Head and body are separate nodes with their own pivots. The body sways; the
   head counter-rotates a beat LATER. That lag is what makes a paper cut-out
   read as a living character instead of a sticker sliding around.
   ========================================================================== */
function placeGirl(scene, t, p, energy, beat) {
  const g = scene.girl;
  if (!g) { EL.head.style.opacity = '0'; EL.body.style.opacity = '0'; EL.shadow.style.opacity = '0'; return; }
  const R = MAP.girls[g.which];
  if (!R) return;

  const full = R.fullBBox;                      // [x,y,w,h] in source pixels
  const scale = (g.h || 1080) / full[3];        // fit the figure to a target height
  const ox = (g.x != null ? g.x : CX) - (full[0] + full[2] / 2) * scale;
  const oy = (g.y != null ? g.y : 1180) - (full[1] + full[3]) * scale;

  /* entrance: pop in with overshoot, then settle */
  const inU = ease(clamp(seg(p, g.inAt != null ? g.inAt : .04, (g.inAt != null ? g.inAt : .04) + .30), 0, 1));
  const outU = 1 - ease(clamp(seg(p, g.outAt != null ? g.outAt : .93, 1), 0, 1));
  const pop = E.back(inU);
  const vis = clamp(inU * outU, 0, 1);

  /* THE FIGURE MOVES AS ONE PIECE.
     It used to be split into a head node and a body node so the head could
     counter-rotate — but that split reads as the head being CUT OFF, which is
     exactly what was objected to. The cut-out is now a single sheet of paper:
     it swings about its feet, breathes on the beat and turns in 3D, but it is
     never divided. */
  const fw = full[2] * scale, fh = full[3] * scale;
  const fx = ox + full[0] * scale, fy = oy + full[1] * scale;

  /* sway about the feet, drift from noise, bob on the beat, turn in 3D */
  const sway = Math.sin(t * 1.15) * 2.2 + noise1(t * .48, 3) * 1.7;
  const nod = Math.pow(1 - beat, 2.4) * 3.0;
  const bob = Math.sin(t * 2.4) * 3.0 * (.5 + energy * .8) + nod;
  const lean = Math.sin(t * .72) * 3.4;
  const tip = Math.sin(t * .95) * 1.5;                       // slight rotateX

  setPart(EL.body, `girl${idxOf(g.which)}.png`, fx, fy, fw, fh,
    fw / 2, fh,                                              // pivot = the feet
    `translateY(${n2(bob)}px) rotateX(${n2(tip)}deg) rotateY(${n2(lean)}deg) `
    + `rotateZ(${n2(sway)}deg) scale(${n2(.82 + .18 * pop)})`,
    vis);

  /* the head node is no longer used — keep it dark so no seam can show */
  EL.head.style.opacity = '0';

  /* a procedural contact shadow: an ellipse on the ground, never a cut */
  const ew = fw * .52, eh = fw * .12;
  EL.shadow.style.backgroundImage = 'none';
  EL.shadow.style.backgroundColor = rgba(C.ink, .30);
  EL.shadow.style.borderRadius = '50%';
  EL.shadow.style.left = n2(fx + fw / 2 - ew / 2) + 'px';
  EL.shadow.style.top = n2(fy + fh - eh * .55) + 'px';
  EL.shadow.style.width = n2(ew) + 'px';
  EL.shadow.style.height = n2(eh) + 'px';
  EL.shadow.style.transformOrigin = '50% 50%';
  EL.shadow.style.transform =
    `scale(${n2((.82 + .18 * pop) * (1 - Math.abs(bob) / 300))})`;
  EL.shadow.style.opacity = (vis * .55).toFixed(3);
}

function setPart(el, file, x, y, w, h, px, py, tf, op) {
  el.style.backgroundImage = `url('../assets/${file}')`;
  el.style.left = n2(x) + 'px';
  el.style.top = n2(y) + 'px';
  el.style.width = n2(w) + 'px';
  el.style.height = n2(h) + 'px';
  el.style.transformOrigin = `${n2(px)}px ${n2(py)}px`;
  el.style.transform = tf;
  el.style.opacity = op.toFixed(3);
}
function idxOf(which) { return { wide: 1, mid: 2, close: 3, hero: 4 }[which] || 1; }

/* ==========================================================================
   TYPE
   Words are authored to land on their measured times with a pop and a small
   3D tilt, not a fade. Keywords get the stacked-paper treatment.
   ========================================================================== */
function paintType(scene, t, p, energy) {
  for (let i = 0; i < wordEls.length; i++) {
    const w = wordData[i], el = wordEls[i];
    let u;
    if (w.s != null) u = clamp((t - w.s) / .18, 0, 1);
    else u = clamp((t - scene.start - (w.at || 0)) / .28, 0, 1);
    const outv = 1 - ease(clamp(seg(t, scene.end - .30, scene.end), 0, 1));
    u = Math.min(u, outv);
    if (u <= .001) {
      el.style.opacity = '0';
      /* collapse it: an unseen word still reserved its box, which pushed the
         visible line off centre (the outro's second «مبروك» shoved the first
         one upward for 4.7s before it had sung a note) */
      el.style.display = (w.s != null && t < w.s - .02) ? 'none' : 'inline-block';
      continue;
    }
    const pop = E.back(clamp(u, 0, 1));
    const rot = (1 - pop) * (i % 2 ? 9 : -9);
    const ty = (1 - pop) * 46;
    const sc = .55 + .45 * pop;
    el.style.opacity = clamp(u, 0, 1).toFixed(3);
    el.style.transform = `translateY(${n2(ty)}px) rotate(${n2(rot)}deg) scale(${n2(sc)})`;
    el.style.display = 'inline-block';
  }
  /* the whole stack breathes very slightly with the voice */
  const s = 1 + .008 * energy;
  EL.stack.style.transform = `scale(${s.toFixed(4)})`;
  EL.stack.style.opacity = '1';
}

/* ---------------------------------------------------------------- chrome */
function paintChrome(scene, t, p, energy) {
  const f = clamp((energy - .55) * .5, 0, 1) * (scene.flashOff ? 0 : 1);
  EL.flash.style.opacity = (f * .06).toFixed(4);
  EL.vig.style.opacity = (1 - .12 * energy).toFixed(3);
}

/* --------------------------------------------------------------- render */
function render(t) {
  const scene = findScene(t);
  if (scene.__i !== sceneIdx) buildScene(scene);
  const p = clamp((t - scene.start) / (scene.end - scene.start), 0, 1);
  const energy = clamp(envAt(t, MAP.rms, MAP.step, .08) * 1.8 +
                       envAt(t, MAP.vocal, MAP.step, .08) * .6, 0, 1.5);

  let beat = 0;
  const B = MAP.beats;
  if (B && B.length) {
    let lo = 0, hi = B.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (B[m] < t) lo = m + 1; else hi = m; }
    const prev = B[lo - 1] != null ? B[lo - 1] : B[0];
    const next = B[lo] != null ? B[lo] : prev + .6;
    beat = clamp((t - prev) / Math.max(.05, next - prev), 0, 1);
  }

  /* ---- camera: authored per scene, driven by keyframes ---- */
  const cam = {
    x: track(scene.camX, p, 0),
    y: track(scene.camY, p, 0),
    z: track(scene.camZ, p, 0),
    rx: track(scene.camRX, p, 0),
    ry: track(scene.camRY, p, 0),
    rz: track(scene.camRZ, p, 0),
  };
  applyCamera(cam);

  const planes = scene.planes || { sky: -1200, far: -700, mid: -260, girl: 0, near: 220, fore: 520 };
  for (const k in planes) EL.planes[k].style.transform = `translateZ(${planes[k]}px)`;
  applyDof(planes, scene.focusZ != null ? scene.focusZ : 0, scene.dof != null ? scene.dof : 3.2);

  placeGirl(scene, t, p, energy, beat);

  const S = { scene, t, p, abs: t, energy, beat,
              logoBox: MAP.logoBox, logoTiles: MAP.logoTiles };
  const fn = ART[scene.art];
  EL.art.innerHTML = fn ? fn(S) : '';
  EL.art.style.transform = `translateZ(${(planes.mid || 0)}px)`;

  /* type sits where the scene wants it in the vertical frame */
  EL.type.style.transform = `translateY(${(scene.typeY != null ? scene.typeY : -520)}px)`;

  paintType(scene, t, p, energy);
  paintChrome(scene, t, p, energy);
}

window.__boot = boot;
window.__render = render;

</script>
